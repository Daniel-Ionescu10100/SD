spring.config.import=optional:file:.env[.properties]

database.ip=${DEVICE_DB_HOST:localhost}
database.port=${DEVICE_DB_PORT:3309}
database.user=${DEVICE_DB_USER:device_app}
database.password=${DEVICE_DB_PASSWORD:change-me}
database.name=${DEVICE_DB_NAME:device_db}

spring.datasource.url=jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=debug

server.port=${PORT:8080}
