spring.config.import=optional:file:.env[.properties]

database.ip=${AUTH_DB_HOST:localhost}
database.port=${AUTH_DB_PORT:3310}
database.user=${AUTH_DB_USER:auth_app}
database.password=${AUTH_DB_PASSWORD:change-me}
database.name=${AUTH_DB_NAME:auth_db}

spring.datasource.url=jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:change-this-secret-to-a-secure-random-256-bit-value}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=debug

server.port=8080
