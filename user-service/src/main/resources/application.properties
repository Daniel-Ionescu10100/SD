spring.config.import=optional:file:.env[.properties]

database.ip=${USER_DB_HOST:localhost}
database.port=${USER_DB_PORT:3309}
database.user=${USER_DB_USER:user_app}
database.password=${USER_DB_PASSWORD:change-me}
database.name=${USER_DB_NAME:user_db}

spring.datasource.url=jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=debug

server.port=${PORT:8080}

device.service.url=${DEVICE_SERVICE_URL:http://device-service:8080}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8080}
