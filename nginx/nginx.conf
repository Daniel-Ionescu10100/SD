events {}

http {
    # ── Upstream services (names MUST NOT contain underscores for RFC 1123 Host compliance) ──
    upstream auth-service-cluster   { server auth-service:8080;   }
    upstream user-service-cluster   { server user-service:8080;   }
    upstream device-service-cluster { server device-service:8080; }
    upstream spring-demo-cluster    { server spring-demo:8080;    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Common proxy headers ─────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Internal sub-request for JWT validation ──────────────────────────
        # auth-service returns 200 + X-User-Id / X-Username / X-Role headers
        location = /auth/validate {
            internal;
            proxy_pass              http://auth-service-cluster/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header        Host "auth-service";
            proxy_set_header        Content-Length "0";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Authorization $http_authorization;
            proxy_method            GET;
        }

        # ── Public: login & register (no token needed) ───────────────────────
        location /auth/login {
            proxy_set_header Host "auth-service";
            proxy_pass http://auth-service-cluster;
        }

        location /auth/register {
            proxy_set_header Host "auth-service";
            proxy_pass http://auth-service-cluster;
        }

        # ── Protected: /user ─────────────────────────────────────────────────
        location /user {
            auth_request /auth/validate;

            # Capture the claim headers returned by auth-service
            auth_request_set $x_user_id  $upstream_http_x_user_id;
            auth_request_set $x_username $upstream_http_x_username;
            auth_request_set $x_role     $upstream_http_x_role;

            # Forward them to the upstream microservice
            proxy_set_header Host       "user-service";
            proxy_set_header X-User-Id  $x_user_id;
            proxy_set_header X-Username $x_username;
            proxy_set_header X-Role     $x_role;

            proxy_pass http://user-service-cluster;
        }

        # ── Protected: /device ───────────────────────────────────────────────
        location /device {
            auth_request /auth/validate;

            auth_request_set $x_user_id  $upstream_http_x_user_id;
            auth_request_set $x_username $upstream_http_x_username;
            auth_request_set $x_role     $upstream_http_x_role;

            proxy_set_header Host       "device-service";
            proxy_set_header X-User-Id  $x_user_id;
            proxy_set_header X-Username $x_username;
            proxy_set_header X-Role     $x_role;

            proxy_pass http://device-service-cluster;
        }

        # ── Interactive Swagger API Documentation ────────────────────────────
        location /docs {
            alias /usr/share/nginx/html/docs/;
            index index.html;
        }

        # ── React frontend ────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
        }

        # ── Health check ─────────────────────────────────────────────────────
        location /health {
            return 200 'nginx ok\n';
            add_header Content-Type text/plain;
        }

        # ── Error handling for auth failures ────────────────────────────────
        error_page 401 = @error401;
        location @error401 {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Valid JWT token required"}';
        }

        error_page 403 = @error403;
        location @error403 {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
        }
    }
}
