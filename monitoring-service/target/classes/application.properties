spring.application.name=monitoring-service
spring.config.import=optional:file:.env[.properties]

# ─── Database (monitoring_db) ────────────────────────────────────────────────
database.ip=${MONITORING_DB_HOST:localhost}
database.port=${MONITORING_DB_PORT:3311}
database.user=${MONITORING_DB_USER:monitoring_app}
database.password=${MONITORING_DB_PASSWORD:change-me}
database.name=${MONITORING_DB_NAME:monitoring_db}

spring.datasource.url=jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── RabbitMQ connection ─────────────────────────────────────────────────────
# Inside Docker the host is the service name "rabbitmq"; locally it is localhost.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:energy}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:energy123}

# A message whose processing throws an exception is NOT put back in the queue
# (otherwise one bad message would be redelivered forever).
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ─── Queue / exchange names (read with @Value or in @RabbitListener) ─────────
monitoring.queue.data=device.data.queue
monitoring.exchange.sync=sync.exchange
monitoring.queue.sync=monitoring-service.sync.queue

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=debug

server.port=${PORT:8080}
